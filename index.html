<html lang="es">
<head>

    <style>
        :root {
            --primary: #1e3a8a;
            --primary-dark: #1e293b;
            --accent: #2563eb;
            --success: #16a34a;

            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-color: #334155;

        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            line-height: 1.6;
            padding: 20px;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            background: var(--card-bg);
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);

        }

        header {
            background: linear-gradient(135deg, var(--primary), #3b82f6);
            color: white;
            padding: 30px;
            text-align: center;
        }

        header h1 {
            font-size: 1.8rem;
            margin-bottom: 10px;
        }

        header p {
            font-size: 1rem;
            opacity: 0.9;
        }

        .content {
            padding: 30px;
        }

        .progress-bar {
            width: 100%;
            height: 8px;
            background: var(--border-color);
            border-radius: 4px;
            margin-bottom: 25px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: var(--accent);
            width: 0%;
            transition: width 0.3s ease;
        }

        .question-card {
            display: none;
        }

        .question-card.active {
            display: block;
            animation: fadeIn 0.4s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .question-number {
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--accent);
            font-weight: 700;
            margin-bottom: 8px;
        }

        .question-title {
            font-size: 1.2rem;
            font-weight: 600;
            color: var(--primary-dark);
            margin-bottom: 20px;
        }

        .options-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 25px;
        }

        .option-label {
            display: flex;
            align-items: center;
            padding: 14px 18px;
            border: 2px solid var(--border-color);
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
            background: white;
            font-size: 1rem;
        }

        .option-label:hover {
            border-color: var(--accent);
            background: #f1f5f9;
        }

        .option-label input {
            margin-right: 15px;
            accent-color: var(--accent);
            transform: scale(1.2);
        }

        .option-label.selected {
            border-color: var(--accent);
            background: #eff6ff;
        }

        .nav-buttons {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-top: 1px solid var(--border-color);
            padding-top: 20px;
        }

        button {
            padding: 10px 22px;
            font-size: 1rem;
            font-weight: 600;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn-secondary {
            background: #e2e8f0;
            color: #475569;
        }

        .btn-secondary:hover {
            background: #cbd5e1;
        }

        .btn-primary {
            background: var(--accent);
            color: white;
        }

        .btn-primary:hover {
            background: #1d4ed8;
        }

        /* Resultados */
        #results-screen {
            display: none;
        }

        .results-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .score-circle {
            width: 130px;
            height: 130px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--accent), var(--primary));

            flex-direction: column;
            justify-content: center;
            align-items: center;
            margin: 0 auto 20px;

            font-weight: 700;
            line-height: 1;
        }

        .score-circle .score-total {
            font-size: 0.9rem;
            opacity: 0.8;
        }

        .badge {
            display: inline-block;
            padding: 6px 16px;
            border-radius: 20px;
            font-weight: 700;
            font-size: 0.95rem;
            margin-top: 10px;

        .badge-bueno { background: #e0f2fe; color: #0369a1; }
        .badge-regular { background: #fef9c3; color: #a16207; }
        .badge-reforzamiento { background: #fee2e2; color: #b91c1c; }

        .review-section {
            margin-top: 30px;
        }

        .review-section h3 {
            margin-bottom: 15px;
            font-size: 1.3rem;
            color: var(--primary-dark);
            border-bottom: 2px solid var(--border-color);
            padding-bottom: 8px;
        }

        .review-item {
            background: #f8fafc;
            border-left: 5px solid var(--border-color);
            padding: 16px;
            border-radius: 0 8px 8px 0;
            margin-bottom: 15px;
        }

        .review-item.correct { border-left-color: var(--success); background: #f0fdf4; }
        .review-item.incorrect { border-left-color: var(--error); background: #fef2f2; }

        .review-question {
            font-weight: 600;
            margin-bottom: 8px;
            color: var(--primary-dark);
        }

        .review-details {
            font-size: 0.95rem;
            display: grid;
            gap: 4px;
        }

        .justification {
            margin-top: 8px;
            font-style: italic;
            color: #475569;
            background: rgba(255, 255, 255, 0.7);
            padding: 8px;
            border-radius: 4px;
        }

        .restart-container {
            text-align: center;
            margin-top: 30px;
        }
    </style>
</head>

<div class="container">
    <header>
        <h1>LIDEI 2022</h1>
        <p>Cuestionario Interactivo – Liderazgo Directivo en Iberoamérica</p>

</div>

        {

        {

            opciones: [
                "A) Reduce la responsabilidad del director hasta eliminarla.",

        {
            id: 29,
            pregunta: "¿Cuál de las siguientes acciones representa mejor la aplicación del liderazgo pedagógico en una unidad educativa?",
            opciones: [
                "A) Priorizar exclusivamente la elaboración de informes administrativos.",

        {
            id: 30,
            pregunta: "¿Cuál sería la aplicación más completa del modelo LIDEI 2022 en la dirección de una unidad educativa?",
            opciones: [
                "A) Concentrar las actividades en la administración y el cumplimiento de informes.",
                "B) Desarrollar una gestión basada únicamente en el control disciplinario.",
                "C) Promover una gestión que integre la mejora pedagógica, la inclusión, la participación compartida y la atención al contexto institucional.",
                "D) Delegar todas las funciones a los asesores de curso y docentes."
            ],
            respuestaCorrecta: 2, // Índice C
            justificacion: "Esta alternativa integra los cuatro componentes del modelo LIDEI: liderazgo pedagógico, inclusivo, distribuido y contextualizado. Representa una dirección escolar integral orientada a la calidad y la equidad educativa."
        }
    ];

    let questions = [];
    let currentQuestionIndex = 0;
    let userAnswers = {};

    // Función para barajar un arreglo (Fisher-Yates)
    function shuffleArray(array) {
        let arr = [...array];
        for (let i = arr.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [arr[i], arr[j]] = [arr[j], arr[i]];
        }
        return arr;
    }

    function initQuiz() {
        // Barajar preguntas aleatoriamente al iniciar
        questions = shuffleArray(originalQuestions);
        currentQuestionIndex = 0;
        userAnswers = {};
        
        document.getElementById('quiz-screen').style.display = 'block';
        document.getElementById('results-screen').style.display = 'none';
        
        renderQuestionsDOM();
        showQuestion(0);
    }

    function renderQuestionsDOM() {
        const container = document.getElementById('questions-container');
        container.innerHTML = '';

        questions.forEach((q, index) => {
            const card = document.createElement('div');
            card.className = `question-card ${index === 0 ? 'active' : ''}`;
            card.id = `question-${index}`;

            let optionsHtml = '';
            q.opciones.forEach((opt, optIndex) => {
                const isSelected = userAnswers[index] === optIndex ? 'selected' : '';
                const checkedAttr = userAnswers[index] === optIndex ? 'checked' : '';
                optionsHtml += `
                    <label class="option-label ${isSelected}" onclick="selectOption(${index}, ${optIndex})">
                        <input type="radio" name="question-${index}" value="${optIndex}" ${checkedAttr}>
                        <span>${opt}</span>
                    </label>
                `;
            });

            card.innerHTML = `
                <div class="question-number">Pregunta ${index + 1} de 30</div>
                <div class="question-title">${q.pregunta}</div>
                <div class="options-list">
                    ${optionsHtml}
                </div>
            `;
            container.appendChild(card);
        });
    }

    function selectOption(qIndex, optIndex) {
        userAnswers[qIndex] = optIndex;
        
        // Actualizar clases visuales en las opciones de esta pregunta
        const card = document.getElementById(`question-${qIndex}`);
        const labels = card.querySelectorAll('.option-label');
        labels.forEach((lbl, idx) => {
            if (idx === optIndex) {
                lbl.classList.add('selected');
                lbl.querySelector('input').checked = true;
            } else {
                lbl.classList.remove('selected');
            }
        });
    }

    function showQuestion(index) {
        const cards = document.querySelectorAll('.question-card');
        cards.forEach((card, idx) => {
            if (idx === index) {
                card.classList.add('active');
            } else {
                card.classList.remove('active');
            }
        });

        currentQuestionIndex = index;

        // Actualizar barra de progreso
        const progressPercent = ((index + 1) / questions.length) * 100;
        document.getElementById('progress-fill').style.width = `${progressPercent}%`;

        // Botones de navegación
        const prevBtn = document.getElementById('prev-btn');
        const nextBtn = document.getElementById('next-btn');

        prevBtn.style.visibility = index === 0 ? 'hidden' : 'visible';
        
        if (index === questions.length - 1) {
            nextBtn.textContent = 'Finalizar Evaluación';
            nextBtn.setAttribute('onclick', 'finishQuiz()');
        } else {
            nextBtn.textContent = 'Siguiente';
            nextBtn.setAttribute('onclick', 'nextQuestion()');
        }
    }

    function nextQuestion() {
        if (currentQuestionIndex < questions.length - 1) {
            showQuestion(currentQuestionIndex + 1);
        }
    }

    function prevQuestion() {
        if (currentQuestionIndex > 0) {
            // Asegurar que el botón siguiente mantenga su acción correcta si retrocede desde el final
            const nextBtn = document.getElementById('next-btn');
            nextBtn.textContent = 'Siguiente';
            nextBtn.setAttribute('onclick', 'nextQuestion()');
            
            showQuestion(currentQuestionIndex - 1);
        }
    }

    function finishQuiz() {
        // Verificar respuestas y calcular puntaje
        let score = 0;
        let reviewHtml = '';

        questions.forEach((q, index) => {
            const userAns = userAnswers[index];
            const isCorrect = userAns === q.respuestaCorrecta;
            if (isCorrect) score++;

            const userAnsText = userAns !== undefined ? q.opciones[userAns] : "Sin responder";
            const correctAnsText = q.opciones[q.respuestaCorrecta];

            reviewHtml += `
                <div class="review-item ${isCorrect ? 'correct' : 'incorrect'}">
                    <div class="review-question">P.${index + 1}: ${q.pregunta}</div>
                    <div class="review-details">
                        <div><strong>Tu respuesta:</strong> ${userAnsText}</div>
                        <div><strong>Respuesta correcta:</strong> ${correctAnsText}</div>
                        <div class="justification"><strong>Justificación:</strong> ${q.justificacion}</div>
                    </div>
                </div>
            `;
        });

        const percentage = Math.round((score / 30) * 100);
        
        // Determinar valoración del nivel de conocimiento
        let badgeText = "";
        let badgeClass = "";
        if (score >= 27) {
            badgeText = "Excelente";
            badgeClass = "badge-excelente";
        } else if (score >= 21) {
            badgeText = "Bueno";
            badgeClass = "badge-bueno";
        } else if (score >= 15) {
            badgeText = "Regular";
            badgeClass = "badge-regular";
        } else {
            badgeText = "Necesita reforzamiento";
            badgeClass = "badge-reforzamiento";
        }

        // Renderizar pantalla de resultados
        document.getElementById('quiz-screen').style.display = 'none';
        document.getElementById('final-score').textContent = score;
        document.getElementById('final-percentage').textContent = `${percentage}%`;
        document.getElementById('badge-container').innerHTML = `<span class="badge ${badgeClass}">${badgeText}</span>`;
        document.getElementById('review-list').innerHTML = reviewHtml;
        document.getElementById('results-screen').style.display = 'block';

        // Scroll hacia arriba
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function restartQuiz() {
        initQuiz();
    }

    // Inicializar al cargar la página
    window.onload = initQuiz;
</script>
